name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    # Documentation and licence changes cannot alter the binaries. Path filters are not
    # evaluated for tag pushes, so tagging still builds and releases as normal.
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JUCE_VERSION: "9.0.3"

jobs:
  #=============================================================================
  # macOS: a universal binary, so the same download runs on Intel and Apple
  # Silicon. macos-14 runners are arm64 and carry both SDK slices.
  #=============================================================================
  macos:
    name: macOS (universal)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # JUCE is a subdirectory that is not committed, and fetching it takes longer
      # than the build does.
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-macos

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel 3

      - name: Verify
        shell: bash
        run: |
          set +e
          ./build/InfinityDrumTests_artefacts/Release/InfinityDrumTests > verify.log 2>&1
          status=$?
          set -e
          cat verify.log
          if [ "$status" -ne 0 ]; then
            # GitHub turns ::error:: lines into check-run annotations, and annotations are
            # readable through the API without repository admin rights. Job logs are not.
            # Without this a failure is only visible to whoever can open the web UI.
            grep -n "FAIL" verify.log | head -12 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            echo "::error::=== last lines before exit ==="
            tail -n 4 verify.log | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            echo "::error::the test suite exited $status"
            exit "$status"
          fi

      - name: Package
        run: |
          # A flat archive: the plugin and the installer side by side, so unzipping gives
          # something the reader can act on rather than a folder to dig through. zip keeps
          # the executable bit, which matters for the script.
          stage=$(mktemp -d)
          cp -R build/InfinityDrum_artefacts/Release/VST3/InfinityDrum.vst3 "$stage/"
          cp -R build/InfinityDrum_artefacts/Release/AU/InfinityDrum.component "$stage/"
          cp scripts/install-macos.sh "$stage/"
          chmod +x "$stage/install-macos.sh"

          # The Audio Unit is validated here as well as built: auval is Apple's own
          # validator and is the only thing that proves an AU actually loads in a host.
          echo "validating the Audio Unit"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/InfinityDrum.component"
          cp -R "$stage/InfinityDrum.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          auval -v aumu In01 Infa | tee auval.log | tail -5
          grep -q "AU VALIDATION SUCCEEDED" auval.log

          out="$PWD/InfinityDrum-macOS-universal.zip"
          ( cd "$stage" && zip -q -r -y "$out" InfinityDrum.vst3 InfinityDrum.component install-macos.sh )
          rm -rf "$stage"

          unzip -l InfinityDrum-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: InfinityDrum-macOS-universal
          path: InfinityDrum-macOS-universal.zip
          if-no-files-found: error

  #=============================================================================
  # Windows: x64 only. A VST3 bundle there is a directory holding the actual
  # .vst3 binary, which is why the packaging step archives the directory.
  #=============================================================================
  windows:
    name: Windows (x64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-windows

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Verify
        shell: bash
        run: |
          set +e
          ./build/InfinityDrumTests_artefacts/Release/InfinityDrumTests.exe > verify.log 2>&1
          status=$?
          set -e
          cat verify.log
          if [ "$status" -ne 0 ]; then
            # GitHub turns ::error:: lines into check-run annotations, and annotations are
            # readable through the API without repository admin rights. Job logs are not.
            # Without this a failure is only visible to whoever can open the web UI.
            grep -n "FAIL" verify.log | head -12 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            echo "::error::=== last lines before exit ==="
            tail -n 4 verify.log | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            echo "::error::the test suite exited $status"
            exit "$status"
          fi

      - name: Package
        shell: pwsh
        run: >
          7z a -tzip InfinityDrum-Windows-x64.zip
          build\InfinityDrum_artefacts\Release\VST3\InfinityDrum.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: InfinityDrum-Windows-x64
          path: InfinityDrum-Windows-x64.zip
          if-no-files-found: error

  #=============================================================================
  # Tagging is what turns a build into a download. Both platforms are attached
  # to one release, so this waits for them.
  #=============================================================================
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job has no checkout, so there is no git remote for gh to infer the
          # repository from, and every call has to name it explicitly.
          trap 'report $LINENO' ERR
          report() { echo "::error::release publish failed at line $1"; }
          set -e

          assets=$(find dist -name '*.zip')
          echo "packages to attach:"
          echo "$assets"

          if [ -z "$assets" ]; then
            echo "::error::no packages were downloaded from the build jobs"
            exit 1
          fi

          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "InfinityDrum $GITHUB_REF_NAME" --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $assets
